services:
  - type: web
    name: nova-market
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: nova-market-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: /var/data/nova-market.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "5"
